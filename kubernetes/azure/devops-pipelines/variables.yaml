variables:
  PROJECT: "thunder"
  ENVIRONMENT: "perf"
  LOCATION: "eastus2"
  PADDING: "001"
  RESOURCE_GROUP_NAME: 'rg-$(PROJECT)-$(ENVIRONMENT)-$(LOCATION)-$(PADDING)'
  AKS_CLUSTER_NAME: 'aks-$(PROJECT)-$(ENVIRONMENT)-$(LOCATION)-$(PADDING)'
  VM_NAME: 'vm$(PROJECT)-$(ENVIRONMENT)-runner-$(LOCATION)-$(PADDING)'
  POSTGRES_CONFIG_SERVER_NAME: 'postgresql-$(PROJECT)-config-$(ENVIRONMENT)-$(LOCATION)-$(PADDING)'
  POSTGRES_RUNTIME_SERVER_NAME: 'postgresql-$(PROJECT)-runtime-$(ENVIRONMENT)-$(LOCATION)-$(PADDING)'
  POSTGRES_USER_SERVER_NAME: 'postgresql-$(PROJECT)-user-$(ENVIRONMENT)-$(LOCATION)-$(PADDING)'
  CONFIG_DB_HOSTNAME: '$(POSTGRES_CONFIG_SERVER_NAME).postgres.database.azure.com'
  RUNTIME_DB_HOSTNAME: '$(POSTGRES_RUNTIME_SERVER_NAME).postgres.database.azure.com'
  USER_DB_HOSTNAME: '$(POSTGRES_USER_SERVER_NAME).postgres.database.azure.com'
  INTERNAL_NGINX_CONTROLLER_LB_INTERNAL_IP: "10.0.2.5"
  INTERNAL_NGINX_CONTROLLER_LB_INTERNAL_SUBNET: "snet-aksinternallbthunder-$(PADDING)"
  TLS_SECRET_NAME: "thunder-tls"
  THUNDER_KUBERNETES_INGRESS: "thunder-perf-thunderid-ingress"
  THUNDER_HOSTNAME: "thunderid.local"

  # Thunder Deployment Configuration
  THUNDER_REPLICAS: '2'
  THUNDER_CPU_LIMITS: '1.5'
  THUNDER_CPU_REQUESTS: '1'
  THUNDER_MEMORY_LIMITS: '512Mi'
  THUNDER_MEMORY_REQUESTS: '256Mi'

  # Thunder Crypto Configuration
  THUNDER_PASSWORD_HASHING_ALGORITHM: 'SHA256'

  # Thunder Setup (admin user seeded by the setup job)
  THUNDER_ADMIN_USERNAME: 'admin'
  THUNDER_ADMIN_PASSWORD: 'admin'

  # ReadWriteMany storage class for the setup-job PVCs (certs, secrets), shared across replicas.
  # The default RWO Azure Disk class cannot attach to pods on multiple nodes, which blocks
  # replicaCount > 1 and HPA scale-out. azurefile-csi is the built-in AKS RWX class.
  THUNDER_SETUP_STORAGE_CLASS: 'azurefile-csi'

  # Must match default_direct_auth_secret in perf-scripts/common/jmeter/perf-test-thunder.sh.
  THUNDER_DIRECT_AUTH_SECRET: 'asgthunder-perf-direct-auth-secret'

  # HPA Configuration
  THUNDER_HPA_ENABLED: 'true'
  THUNDER_HPA_MAX_REPLICAS: '10'
  THUNDER_HPA_CPU_UTILIZATION: '65'
  THUNDER_HPA_MEMORY_UTILIZATION: '75'

  # Redis Cache Configuration
  REDIS_RELEASE_NAME: 'redis-perf'
  REDIS_NAMESPACE: 'redis'
  REDIS_ADDRESS: 'redis-perf-master.redis.svc.cluster.local:6379'

  # Redis Resource Configuration
  REDIS_CPU_REQUESTS: '16'
  REDIS_CPU_LIMITS: '16'
  REDIS_MEMORY_REQUESTS: '32Gi'
  REDIS_MEMORY_LIMITS: '32Gi'
  REDIS_REPLICA_CPU_REQUESTS: '6'
  REDIS_REPLICA_CPU_LIMITS: '6'
  REDIS_REPLICA_MEMORY_REQUESTS: '8Gi'
  REDIS_REPLICA_MEMORY_LIMITS: '8Gi'

  # Redis Replica Autoscaling (HPA)
  REDIS_REPLICA_HPA_MIN_REPLICAS: '5'
  REDIS_REPLICA_HPA_MAX_REPLICAS: '10'
  REDIS_REPLICA_HPA_CPU_UTILIZATION: '70'
  REDIS_REPLICA_HPA_MEMORY_UTILIZATION: '80'

  # Database Configuration
  CONFIG_DB_TYPE: 'postgres'
  CONFIG_DB_NAME: 'configdb'
  CONFIG_DB_HOST: $(CONFIG_DB_HOSTNAME)
  CONFIG_DB_PORT: '5432'
  RUNTIME_DB_TYPE: 'postgres'
  RUNTIME_DB_NAME: 'runtime_transient'
  RUNTIME_DB_HOST: $(RUNTIME_DB_HOSTNAME)
  RUNTIME_DB_PORT: '5432'
  # Key prefix applied when the transient runtime store is backed by Redis.
  RUNTIME_TRANSIENT_DB_REDIS_KEY_PREFIX: ''
  # The persistent runtime store always stays on Postgres. Redis here is configured with
  # allkeys-lru eviction and no persistence (see redis-values.yaml), so it cannot safely hold
  # data that must survive eviction or a restart.
  RUNTIME_PERSISTENT_DB_TYPE: 'postgres'
  RUNTIME_PERSISTENT_DB_NAME: 'runtime_persistent'
  RUNTIME_PERSISTENT_DB_HOST: $(RUNTIME_DB_HOSTNAME)
  RUNTIME_PERSISTENT_DB_PORT: '5432'
  USER_DB_TYPE: 'postgres'
  USER_DB_NAME: 'entitydb'
  USER_DB_HOST: $(USER_DB_HOSTNAME)
  USER_DB_PORT: '5432'
  # SSL mode used when connecting to the Postgres servers (Azure Postgres enforces SSL).
  DB_SSL_MODE: 'require'

  # Database Connection Pool Configuration
  DB_MAX_OPEN_CONNS: '10'
  DB_MAX_IDLE_CONNS: '10'
  DB_CONN_MAX_LIFETIME: '3600'

  # Database Retry Configuration
  DB_MAX_RETRIES: '3'
  DB_MIN_RETRY_BACKOFF_MS: '50'
  DB_MAX_RETRY_BACKOFF_MS: '2000'
