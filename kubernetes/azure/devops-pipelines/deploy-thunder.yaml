trigger: none

pr: none

parameters:
  - name: INSTALL_INTERNAL_NGINX_INGRESS
    displayName: Install Internal NGINX Ingress Controller
    type: boolean
    default: true
  - name: CREATE_TLS_SECRET
    displayName: Create Nginx TLS Secret
    type: boolean
    default: true
  - name: SETUP_DB_SCHEMA
    displayName: Setup Database Schema
    type: boolean
    default: true
  - name: INSTALL_THUNDER
    displayName: Install Thunder
    type: boolean
    default: true
  - name: ADD_HOSTS_ENTRY
    displayName: Add Hosts Entry to VM
    type: boolean
    default: true
  - name: RUNTIME_DB_TYPE
    displayName: Runtime Database Type
    type: string
    default: 'postgres'
    values:
      - postgres
      - redis
  - name: CACHE_MODE
    displayName: Cache Mode
    type: string
    default: 'in-memory'
    values:
      - disabled
      - in-memory
      - redis
  # Redis sizing. Only applied when Cache Mode or Runtime Database Type is 'redis'.
  # The master's CPU/memory requests must fit on a single node, so a 16 vCore master
  # needs a node pool of Standard_F32s_v2 or larger.
  # NOTE: redis-values.yaml pins 'maxmemory' (14gb master, 6gb replica). Keep those below
  # the memory limits set here, or Redis will grow past its limit and be OOM-killed.
  - name: REDIS_CPU_REQUESTS
    displayName: Redis Master CPU Requests
    type: string
    default: '16'
  - name: REDIS_CPU_LIMITS
    displayName: Redis Master CPU Limits
    type: string
    default: '16'
  - name: REDIS_MEMORY_REQUESTS
    displayName: Redis Master Memory Requests
    type: string
    default: '32Gi'
  - name: REDIS_MEMORY_LIMITS
    displayName: Redis Master Memory Limits
    type: string
    default: '32Gi'
  - name: REDIS_REPLICA_CPU_REQUESTS
    displayName: Redis Replica CPU Requests
    type: string
    default: '6'
  - name: REDIS_REPLICA_CPU_LIMITS
    displayName: Redis Replica CPU Limits
    type: string
    default: '6'
  - name: REDIS_REPLICA_MEMORY_REQUESTS
    displayName: Redis Replica Memory Requests
    type: string
    default: '8Gi'
  - name: REDIS_REPLICA_MEMORY_LIMITS
    displayName: Redis Replica Memory Limits
    type: string
    default: '8Gi'
  - name: REDIS_REPLICA_HPA_MIN_REPLICAS
    displayName: Redis Replica HPA Min Replicas
    type: string
    default: '5'
  - name: REDIS_REPLICA_HPA_MAX_REPLICAS
    displayName: Redis Replica HPA Max Replicas
    type: string
    default: '10'
  - name: REDIS_REPLICA_HPA_CPU_UTILIZATION
    displayName: Redis Replica HPA Target CPU Utilization (%)
    type: string
    default: '70'
  - name: REDIS_REPLICA_HPA_MEMORY_UTILIZATION
    displayName: Redis Replica HPA Target Memory Utilization (%)
    type: string
    default: '80'
  - name: POPULATE_TEST_DATA
    displayName: Populate Test Data
    type: boolean
    default: true
  - name: THUNDER_REPO
    type: string
    displayName: "Thunder Repository"
    default: "thunder-id/thunderid"
  - name: THUNDER_REPO_BRANCH
    type: string
    displayName: "Thunder Repository Branch"
    default: "main"
  - name: PERFORMANCE_REPO
    displayName: Performance repo name
    type: string
    default: "asgardeo/thunder-performance"
  - name: PERFORMANCE_REPO_BRANCH
    displayName: Performance repo branch name
    type: string
    default: "main"
  - name: THUNDER_IMAGE_REGISTRY
    displayName: Thunder Image Registry
    type: string
    default: "ghcr.io/thunder-id"
  - name: THUNDER_IMAGE_REPOSITORY
    displayName: Thunder Image Repository
    type: string
    default: "thunderid"
  - name: THUNDER_IMAGE_TAG
    displayName: Thunder Image Tag
    type: string
    default: "1.0.0-alpha"
  # Nginx fronts every request, so it becomes the bottleneck before Thunder does at high
  # concurrency unless it is scaled alongside the Thunder pods and the AKS node pool.
  - name: NGINX_REPLICAS
    displayName: Nginx Replicas (also the HPA minimum)
    type: string
    default: '2'
  - name: NGINX_MAX_REPLICAS
    displayName: Nginx HPA Max Replicas
    type: string
    default: '5'
  - name: NGINX_CPU_LIMITS
    displayName: Nginx CPU Limits
    type: string
    default: '1000m'
  - name: NGINX_CPU_REQUESTS
    displayName: Nginx CPU Requests
    type: string
    default: '500m'
  - name: NGINX_MEMORY_LIMITS
    displayName: Nginx Memory Limits
    type: string
    default: '1000Mi'
  - name: NGINX_MEMORY_REQUESTS
    displayName: Nginx Memory Requests
    type: string
    default: '500Mi'
  - name: NGINX_TARGET_CPU_UTILIZATION
    displayName: Nginx HPA Target CPU Utilization (%)
    type: string
    default: '80'
  - name: NGINX_TARGET_MEMORY_UTILIZATION
    displayName: Nginx HPA Target Memory Utilization (%)
    type: string
    default: '80'

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: vg-thunder-perf
  - group: vg-thunder-perf-secrets
  - template: ./variables.yaml
  - name: THUNDER_REPO
    value: ${{parameters.THUNDER_REPO}}
  - name: THUNDER_REPO_BRANCH
    value: ${{parameters.THUNDER_REPO_BRANCH}}
  - name: PERFORMANCE_REPO
    value: ${{parameters.PERFORMANCE_REPO}}
  - name: PERFORMANCE_REPO_BRANCH
    value: ${{parameters.PERFORMANCE_REPO_BRANCH}}
  - name: RUNTIME_DB_TYPE
    value: ${{parameters.RUNTIME_DB_TYPE}}
  - name: REDIS_CPU_REQUESTS
    value: ${{parameters.REDIS_CPU_REQUESTS}}
  - name: REDIS_CPU_LIMITS
    value: ${{parameters.REDIS_CPU_LIMITS}}
  - name: REDIS_MEMORY_REQUESTS
    value: ${{parameters.REDIS_MEMORY_REQUESTS}}
  - name: REDIS_MEMORY_LIMITS
    value: ${{parameters.REDIS_MEMORY_LIMITS}}
  - name: REDIS_REPLICA_CPU_REQUESTS
    value: ${{parameters.REDIS_REPLICA_CPU_REQUESTS}}
  - name: REDIS_REPLICA_CPU_LIMITS
    value: ${{parameters.REDIS_REPLICA_CPU_LIMITS}}
  - name: REDIS_REPLICA_MEMORY_REQUESTS
    value: ${{parameters.REDIS_REPLICA_MEMORY_REQUESTS}}
  - name: REDIS_REPLICA_MEMORY_LIMITS
    value: ${{parameters.REDIS_REPLICA_MEMORY_LIMITS}}
  - name: REDIS_REPLICA_HPA_MIN_REPLICAS
    value: ${{parameters.REDIS_REPLICA_HPA_MIN_REPLICAS}}
  - name: REDIS_REPLICA_HPA_MAX_REPLICAS
    value: ${{parameters.REDIS_REPLICA_HPA_MAX_REPLICAS}}
  - name: REDIS_REPLICA_HPA_CPU_UTILIZATION
    value: ${{parameters.REDIS_REPLICA_HPA_CPU_UTILIZATION}}
  - name: REDIS_REPLICA_HPA_MEMORY_UTILIZATION
    value: ${{parameters.REDIS_REPLICA_HPA_MEMORY_UTILIZATION}}

resources:
  repositories:
    - repository: thunder-repo
      type: github
      endpoint: asgardeo
      name: $(THUNDER_REPO)
      # Compile-time expression, not $(VAR). Azure DevOps normalises a repository ref that
      # does not literally start with refs/ by prefixing refs/heads/, which it does before
      # runtime macros expand. Using ${{ parameters.* }} puts the literal value in the YAML
      # so a tag such as refs/tags/v1.0.0-alpha resolves correctly.
      ref: ${{ parameters.THUNDER_REPO_BRANCH }}
    - repository: thunder-performance
      type: github
      endpoint: asgardeo
      name: $(PERFORMANCE_REPO)
      # Compile-time expression, not $(VAR). Azure DevOps normalises a repository ref that
      # does not literally start with refs/ by prefixing refs/heads/, which it does before
      # runtime macros expand. Using ${{ parameters.* }} puts the literal value in the YAML
      # so a tag such as refs/tags/v1.0.0-alpha resolves correctly.
      ref: ${{ parameters.PERFORMANCE_REPO_BRANCH }}

jobs:
  - job: create_tls_secret
    condition: eq('${{ parameters.CREATE_TLS_SECRET }}', true)
    displayName: Create Nginx TLS Secret
    steps:
      - template: './templates/create-tls-secret.yaml'

  - job: install_nginx
    condition: eq('${{ parameters.INSTALL_INTERNAL_NGINX_INGRESS }}', true)
    displayName: Install NGINX Ingress Controller
    steps:
      - template: './templates/install-nginx.yaml'
        parameters:
          LB_INTERNAL_IP: $(INTERNAL_NGINX_CONTROLLER_LB_INTERNAL_IP)
          LB_INTERNAL_SUBNET: $(INTERNAL_NGINX_CONTROLLER_LB_INTERNAL_SUBNET)
          NO_OF_REPLICAS: ${{ parameters.NGINX_REPLICAS }}
          MAX_REPLICAS: ${{ parameters.NGINX_MAX_REPLICAS }}
          NGINX_CPU_LIMITS: ${{ parameters.NGINX_CPU_LIMITS }}
          NGINX_CPU_REQUESTS: ${{ parameters.NGINX_CPU_REQUESTS }}
          NGINX_MEMORY_LIMITS: ${{ parameters.NGINX_MEMORY_LIMITS }}
          NGINX_MEMORY_REQUESTS: ${{ parameters.NGINX_MEMORY_REQUESTS }}
          TARGET_CPU_UTILIZATION: ${{ parameters.NGINX_TARGET_CPU_UTILIZATION }}
          TARGET_MEMORY_UTILIZATION: ${{ parameters.NGINX_TARGET_MEMORY_UTILIZATION }}

  - job: setup_db_schema
    displayName: Setup Database Schema
    condition: eq('${{ parameters.SETUP_DB_SCHEMA }}', true)
    steps:
      - checkout: thunder-repo
        path: "thunder-repo"
      - template: './templates/setup-db-schema.yaml'
        parameters:
          WORKING_DIRECTORY: $(Agent.BuildDirectory)/thunder-repo/backend

  - job: install_redis
    displayName: Install Redis
    condition: or(eq('${{ parameters.CACHE_MODE }}', 'redis'), eq('${{ parameters.RUNTIME_DB_TYPE }}', 'redis'))
    steps:
      - checkout: self
      - template: './templates/install-redis.yaml'
        parameters:
          RELEASE_NAME: $(REDIS_RELEASE_NAME)
          NAMESPACE: $(REDIS_NAMESPACE)
          REDIS_PASSWORD: $(REDIS-PASSWORD)
          INSTALL_REDIS_INSIGHT: true

  - job: install_thunder
    displayName: Install Thunder
    dependsOn:
      - setup_db_schema
      - install_redis
    condition: eq('${{ parameters.INSTALL_THUNDER }}', true)
    steps:
      - checkout: thunder-repo
        path: "thunder-repo"
      - template: './templates/install-thunder.yaml'
        parameters:
          WORKING_DIRECTORY: $(Agent.BuildDirectory)/thunder-repo/install/helm
          THUNDER_IMAGE_REGISTRY: ${{ parameters.THUNDER_IMAGE_REGISTRY }}
          THUNDER_IMAGE_REPOSITORY: ${{ parameters.THUNDER_IMAGE_REPOSITORY }}
          THUNDER_IMAGE_TAG: ${{ parameters.THUNDER_IMAGE_TAG }}
          CACHE_MODE: ${{ parameters.CACHE_MODE }}

  - job: add_hosts_entry_to_vm
    displayName: Add Hosts Entry to VM
    dependsOn: install_thunder
    condition: eq('${{ parameters.ADD_HOSTS_ENTRY }}', true)
    steps:
      - template: './templates/add-hosts-entry-to-vm.yaml'

  - job: populate_test_data
    displayName: Populate Test Data
    dependsOn:
      - install_thunder
      - install_nginx
      - create_tls_secret
      - add_hosts_entry_to_vm
    condition: eq('${{ parameters.POPULATE_TEST_DATA }}', true)
    steps:
      - checkout: thunder-performance
        path: "thunder-performance"
      - template: './templates/populate-test-data.yaml'
        parameters:
          WORKING_DIRECTORY: $(Agent.BuildDirectory)/thunder-performance/perf-scripts
