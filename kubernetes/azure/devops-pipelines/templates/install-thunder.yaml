parameters:
  - name: WORKING_DIRECTORY
    type: string
  - name: RELEASE_NAME
    type: string
    default: 'thunder-perf'
  - name: NAMESPACE
    type: string
    default: 'default'
  - name: THUNDER_IMAGE_REGISTRY
    type: string
    default: 'ghcr.io/asgardeo'
  - name: THUNDER_IMAGE_REPOSITORY
    type: string
    default: 'thunder'
  - name: THUNDER_IMAGE_TAG
    type: string
    default: '0.7.0'
  - name: RUN_SETUP_SCRIPT
    type: boolean
    default: true

steps:
  - template: ./utils/set-aks-credentials.yaml
  - task: AzureCLI@2
    displayName: 'Install Thunder'
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION_NAME)
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: ${{ parameters.WORKING_DIRECTORY }}
      inlineScript: |
        set -e
        SETUP_JOB=${{ parameters.RELEASE_NAME }}-thunderid-setup
        SETUP_LOG=$(mktemp)
        SETUP_CAPTURE_DIR=$(mktemp -d)
        dump_thunder_diagnostics() {
          echo "##[error]Thunder install did not become ready. Dumping diagnostics:"
          kubectl get pods -n ${{ parameters.NAMESPACE }} -o wide || true
          kubectl get events -n ${{ parameters.NAMESPACE }} --sort-by=.lastTimestamp | tail -n 30 || true
          THUNDER_POD=$(kubectl get pods -n ${{ parameters.NAMESPACE }} -l app.kubernetes.io/instance=${{ parameters.RELEASE_NAME }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$THUNDER_POD" ]; then
            kubectl describe pod "$THUNDER_POD" -n ${{ parameters.NAMESPACE }} || true
            kubectl logs "$THUNDER_POD" -n ${{ parameters.NAMESPACE }} --all-containers --tail=200 || true
            kubectl logs "$THUNDER_POD" -n ${{ parameters.NAMESPACE }} --all-containers --previous --tail=200 || true
          fi
          echo "--- Setup/bootstrap job (seeds default resources incl. the Console app) ---"
          kubectl describe job "$SETUP_JOB" -n ${{ parameters.NAMESPACE }} || true
          # The setup pod is deleted the instant the job hits BackoffLimitExceeded, so a
          # post-hoc "kubectl logs" loses the race. Prefer the log captured live below.
          # Snapshot count doubles as proof this template version is the one that ran: zero means
          # the collector never saw the pod, not that the pod produced no output.
          echo "--- Setup/bootstrap job logs (captured live, snapshots: $(ls -1 "$SETUP_CAPTURE_DIR" 2>/dev/null | wc -l | tr -d ' ')) ---"
          cat "$SETUP_LOG" 2>/dev/null || true
          for f in "$SETUP_CAPTURE_DIR"/*; do
            [ -s "$f" ] || continue
            echo "--- $(basename "$f") ---"
            cat "$f"
          done
          echo "--- Setup/bootstrap job logs (post-hoc, may be empty if pod already deleted) ---"
          kubectl logs job/"$SETUP_JOB" -n ${{ parameters.NAMESPACE }} --all-containers --tail=200 || true
          kubectl logs -n ${{ parameters.NAMESPACE }} -l job-name="$SETUP_JOB" --all-containers --tail=200 || true
          kubectl logs -n ${{ parameters.NAMESPACE }} -l job-name="$SETUP_JOB" --all-containers --previous --tail=200 || true
        }
        trap dump_thunder_diagnostics ERR
        # Background collector: snapshot the setup pod's logs while the pre-install hook runs, so
        # the crash output survives the job controller deleting the failed pod. The setup job uses
        # restartPolicy: OnFailure, so a crashing container spends nearly all of its life in
        # CrashLoopBackOff; "kubectl logs -f" only blocks there until it times out and captures
        # nothing. Poll instead, and take --previous as well: once the container has crashed once,
        # --previous returns the full failing run even while the next attempt is backing off.
        (
          for _ in $(seq 1 150); do
            # Match on the pod name prefix rather than a label: "job-name" is deprecated and newer
            # clusters only set "batch.kubernetes.io/job-name", so a label selector can silently
            # match nothing. Job pods are always named "<job>-<suffix>".
            POD=$(kubectl get pods -n ${{ parameters.NAMESPACE }} \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
              | grep "^$SETUP_JOB-" || true)
            for p in $POD; do
              for which in current previous; do
                [ "$which" = "previous" ] && PREV_FLAG=--previous || PREV_FLAG=
                OUT="$SETUP_CAPTURE_DIR/$p.$which.log"
                # Snapshot to a temp file and only promote it when non-empty, so a failed read
                # after the pod is deleted does not wipe what was already captured.
                if kubectl logs "$p" -n ${{ parameters.NAMESPACE }} --all-containers $PREV_FLAG \
                  --tail=-1 > "$OUT.tmp" 2>/dev/null && [ -s "$OUT.tmp" ]; then
                  mv "$OUT.tmp" "$OUT"
                fi
                rm -f "$OUT.tmp"
              done
              # Container-level failures (image pull, missing secret key, mount errors) never
              # produce logs at all; the pod description is the only place they show up.
              if kubectl describe pod "$p" -n ${{ parameters.NAMESPACE }} \
                > "$SETUP_CAPTURE_DIR/$p.describe.txt.tmp" 2>/dev/null; then
                mv "$SETUP_CAPTURE_DIR/$p.describe.txt.tmp" "$SETUP_CAPTURE_DIR/$p.describe.txt"
              fi
              rm -f "$SETUP_CAPTURE_DIR/$p.describe.txt.tmp"
            done
            sleep 2
          done
        ) &
        SETUP_LOG_COLLECTOR_PID=$!
        # Record which chart source this run used. deploy-thunder and perf-test-execution check out
        # the Thunder repo through different parameters, so a mismatch here is otherwise invisible.
        echo "=== Chart source ==="
        helm show chart . | grep -E '^(name|version|appVersion):' || true
        git -C . rev-parse --short HEAD 2>/dev/null || true
        echo "Installing Thunder Helm Chart"
        helm upgrade --install ${{ parameters.RELEASE_NAME }} . \
          --namespace ${{ parameters.NAMESPACE }} \
          --set deployment.replicaCount=$(THUNDER_REPLICAS) \
          --set deployment.image.registry=${{ parameters.THUNDER_IMAGE_REGISTRY }} \
          --set deployment.image.repository=${{ parameters.THUNDER_IMAGE_REPOSITORY }} \
          --set deployment.image.tag=${{ parameters.THUNDER_IMAGE_TAG }} \
          --set deployment.resources.limits.cpu=$(THUNDER_CPU_LIMITS) \
          --set deployment.resources.requests.cpu=$(THUNDER_CPU_REQUESTS) \
          --set deployment.resources.limits.memory=$(THUNDER_MEMORY_LIMITS) \
          --set deployment.resources.requests.memory=$(THUNDER_MEMORY_REQUESTS) \
          --set hpa.enabled=$(THUNDER_HPA_ENABLED) \
          --set hpa.maxReplicas=$(THUNDER_HPA_MAX_REPLICAS) \
          --set hpa.averageUtilizationCPU=$(THUNDER_HPA_CPU_UTILIZATION) \
          --set hpa.averageUtilizationMemory=$(THUNDER_HPA_MEMORY_UTILIZATION) \
          --set ingress.tlsSecretsName=$(TLS_SECRET_NAME) \
          --set configuration.database.config.type=$(CONFIG_DB_TYPE) \
          --set configuration.database.config.postgres.name=$(CONFIG_DB_NAME) \
          --set configuration.database.config.postgres.hostname=$(CONFIG_DB_HOST) \
          --set configuration.database.config.postgres.port=$(CONFIG_DB_PORT) \
          --set configuration.database.config.postgres.username=$(POSTGRES-ADMIN-USERNAME) \
          --set configuration.database.config.postgres.password=$(POSTGRES-ADMIN-PASSWORD) \
          --set configuration.database.config.postgres.sslmode=$(DB_SSL_MODE) \
          --set configuration.database.config.postgres.max_open_conns=$(DB_MAX_OPEN_CONNS) \
          --set configuration.database.config.postgres.max_idle_conns=$(DB_MAX_IDLE_CONNS) \
          --set configuration.database.config.postgres.conn_max_lifetime=$(DB_CONN_MAX_LIFETIME) \
          --set configuration.database.config.postgres.max_retries=$(DB_MAX_RETRIES) \
          --set configuration.database.config.postgres.min_retry_backoff_ms=$(DB_MIN_RETRY_BACKOFF_MS) \
          --set configuration.database.config.postgres.max_retry_backoff_ms=$(DB_MAX_RETRY_BACKOFF_MS) \
          --set configuration.database.runtime_transient.type=$(RUNTIME_DB_TYPE) \
          --set configuration.database.runtime_transient.postgres.name=$(RUNTIME_DB_NAME) \
          --set configuration.database.runtime_transient.postgres.hostname=$(RUNTIME_DB_HOST) \
          --set configuration.database.runtime_transient.postgres.port=$(RUNTIME_DB_PORT) \
          --set configuration.database.runtime_transient.postgres.username=$(POSTGRES-ADMIN-USERNAME) \
          --set configuration.database.runtime_transient.postgres.password=$(POSTGRES-ADMIN-PASSWORD) \
          --set configuration.database.runtime_transient.postgres.sslmode=$(DB_SSL_MODE) \
          --set configuration.database.runtime_transient.postgres.max_open_conns=$(DB_MAX_OPEN_CONNS) \
          --set configuration.database.runtime_transient.postgres.max_idle_conns=$(DB_MAX_IDLE_CONNS) \
          --set configuration.database.runtime_transient.postgres.conn_max_lifetime=$(DB_CONN_MAX_LIFETIME) \
          --set configuration.database.runtime_transient.postgres.max_retries=$(DB_MAX_RETRIES) \
          --set configuration.database.runtime_transient.postgres.min_retry_backoff_ms=$(DB_MIN_RETRY_BACKOFF_MS) \
          --set configuration.database.runtime_transient.postgres.max_retry_backoff_ms=$(DB_MAX_RETRY_BACKOFF_MS) \
          --set configuration.database.runtime_persistent.type=$(RUNTIME_PERSISTENT_DB_TYPE) \
          --set configuration.database.runtime_persistent.postgres.name=$(RUNTIME_PERSISTENT_DB_NAME) \
          --set configuration.database.runtime_persistent.postgres.hostname=$(RUNTIME_PERSISTENT_DB_HOST) \
          --set configuration.database.runtime_persistent.postgres.port=$(RUNTIME_PERSISTENT_DB_PORT) \
          --set configuration.database.runtime_persistent.postgres.username=$(POSTGRES-ADMIN-USERNAME) \
          --set configuration.database.runtime_persistent.postgres.password=$(POSTGRES-ADMIN-PASSWORD) \
          --set configuration.database.runtime_persistent.postgres.sslmode=$(DB_SSL_MODE) \
          --set configuration.database.runtime_persistent.postgres.max_open_conns=$(DB_MAX_OPEN_CONNS) \
          --set configuration.database.runtime_persistent.postgres.max_idle_conns=$(DB_MAX_IDLE_CONNS) \
          --set configuration.database.runtime_persistent.postgres.conn_max_lifetime=$(DB_CONN_MAX_LIFETIME) \
          --set configuration.database.runtime_persistent.postgres.max_retries=$(DB_MAX_RETRIES) \
          --set configuration.database.runtime_persistent.postgres.min_retry_backoff_ms=$(DB_MIN_RETRY_BACKOFF_MS) \
          --set configuration.database.runtime_persistent.postgres.max_retry_backoff_ms=$(DB_MAX_RETRY_BACKOFF_MS) \
          --set configuration.database.entity.type=$(USER_DB_TYPE) \
          --set configuration.database.entity.postgres.name=$(USER_DB_NAME) \
          --set configuration.database.entity.postgres.hostname=$(USER_DB_HOST) \
          --set configuration.database.entity.postgres.port=$(USER_DB_PORT) \
          --set configuration.database.entity.postgres.username=$(POSTGRES-ADMIN-USERNAME) \
          --set configuration.database.entity.postgres.password=$(POSTGRES-ADMIN-PASSWORD) \
          --set configuration.database.entity.postgres.sslmode=$(DB_SSL_MODE) \
          --set configuration.database.entity.postgres.max_open_conns=$(DB_MAX_OPEN_CONNS) \
          --set configuration.database.entity.postgres.max_idle_conns=$(DB_MAX_IDLE_CONNS) \
          --set configuration.database.entity.postgres.conn_max_lifetime=$(DB_CONN_MAX_LIFETIME) \
          --set configuration.database.entity.postgres.max_retries=$(DB_MAX_RETRIES) \
          --set configuration.database.entity.postgres.min_retry_backoff_ms=$(DB_MIN_RETRY_BACKOFF_MS) \
          --set configuration.database.entity.postgres.max_retry_backoff_ms=$(DB_MAX_RETRY_BACKOFF_MS) \
          --set configuration.server.security.directAuthSecret=$(THUNDER_DIRECT_AUTH_SECRET) \
          --set configuration.crypto.passwordHashing.algorithm=$(THUNDER_PASSWORD_HASHING_ALGORITHM) \
          --set deployment.securityContext.readOnlyRootFilesystem=false \
          --set setup.enabled=${{ parameters.RUN_SETUP_SCRIPT }} \
          --set setup.admin.username=$(THUNDER_ADMIN_USERNAME) \
          --set setup.admin.password=$(THUNDER_ADMIN_PASSWORD) \
          --set certs.persistence.accessMode=ReadWriteMany \
          --set certs.persistence.storageClass=$(THUNDER_SETUP_STORAGE_CLASS) \
          --set secrets.persistence.accessMode=ReadWriteMany \
          --set secrets.persistence.storageClass=$(THUNDER_SETUP_STORAGE_CLASS) \
          --set configuration.cache.disabled=false \
          --wait \
          --timeout 5m
        kill "$SETUP_LOG_COLLECTOR_PID" 2>/dev/null || true
        echo "Thunder Helm Chart installed successfully"
        echo "=== Post-install Thunder status ==="
        echo "--- Pods ---"
        kubectl get pods -n ${{ parameters.NAMESPACE }} -o wide || true
        echo "--- Services ---"
        kubectl get svc -n ${{ parameters.NAMESPACE }} -o wide || true
        echo "--- Endpoints (empty ENDPOINTS behind the Thunder service explains nginx 503) ---"
        kubectl get endpoints -n ${{ parameters.NAMESPACE }} || true
        echo "--- Ingress ---"
        kubectl get ingress -n ${{ parameters.NAMESPACE }} -o wide || true
